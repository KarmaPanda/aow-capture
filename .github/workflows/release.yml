name: Release

# Push a tag like v0.2.1 (matching VERSION in client/aowcap/__init__.py) to build and
# publish a release. Installed copies of AoW Capture pick it up automatically.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q tests

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'client'); import aowcap; print(aowcap.VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match VERSION $v" }

      - run: python build.py

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py "${{ github.ref_name }}" | Out-File -Encoding utf8 release-notes.md
          gh release create "${{ github.ref_name }}" dist/AoWCapture.exe dist/AoWCapture.zip dist/SHA256SUMS.txt `
            --title "AoW Capture ${{ github.ref_name }}" --notes-file release-notes.md
