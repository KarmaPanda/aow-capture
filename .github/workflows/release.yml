name: Release

# Publishes a release whenever VERSION (client/aowcap/__init__.py) on main is one that
# hasn't been released yet. So: bump VERSION, add a CHANGELOG.md section, push to main.
# Installed copies of AoW Capture pick the release up automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path client/aowcap/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v already released" }
          else { "skip=false" >> $env:GITHUB_OUTPUT; Write-Host "Releasing v$v" }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          python-version: "3.12"
      - if: steps.ver.outputs.skip == 'false'
        run: python -m pip install -r requirements.txt pyinstaller pytest pytest-github-actions-annotate-failures
      - if: steps.ver.outputs.skip == 'false'
        run: python -m pytest -q tests
      - if: steps.ver.outputs.skip == 'false'
        run: python build.py

      - name: Publish the release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py "${{ steps.ver.outputs.tag }}" | Out-File -Encoding utf8 release-notes.md
          gh release create "${{ steps.ver.outputs.tag }}" dist/AoWCapture.exe dist/AoWCapture.zip dist/SHA256SUMS.txt `
            --target "${{ github.sha }}" --title "AoW Capture ${{ steps.ver.outputs.tag }}" --notes-file release-notes.md
